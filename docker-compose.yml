# SmartCon-Kurse — lokaler Betrieb
# Anmeldungen der CLIs werden vom Host gemountet (nichts Geheimes im Image).
# Pfade ggf. anpassen ($HOME zeigt auf den aufrufenden Benutzer).

services:
  app:
    build: .
    container_name: smartcon-kurse
    ports:
      - "8710:8710"
    extra_hosts:
      # damit Dienste auf dem Host (z. B. der Whisper-SSH-Tunnel) erreichbar sind:
      # in den Einstellungen http://host.docker.internal:18710/v1 eintragen
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/config.json
      # Haus-Logo für den Präsentations-Skill (config-logo.png, gitignored).
      # ACHTUNG Docker-Falle: fehlt die Datei auf dem Host beim ersten Start,
      # legt Docker an dieser Stelle statt der erwarteten Datei ein VERZEICHNIS
      # an — danach schlägt jeder Logo-Upload fehl. Deshalb vor jedem
      # "docker compose up" absichern: touch config-logo.png (siehe CLAUDE.md).
      - ./config-logo.png:/app/config-logo.png
      - ./projects:/app/projects
      # Kursverwaltung: Teilnehmer, Zugänge, Prüfungsversuche. Enthält
      # Kundendaten und gehört wie config.json nie ins Repo.
      - ./data:/app/data
      # Anmeldungen (read-write, die CLIs pflegen dort Tokens/Sessions)
      - $HOME/.claude:/root/.claude
      # Plugin-Skills werden von claude -p im Container nicht geladen (siehe
      # docs/superpowers/notizen/2026-08-07-skill-verfuegbarkeit.md) — deshalb
      # den Präsentations-Skill zusätzlich dort mounten, wo lokale Skills liegen.
      # ACHTUNG Versionsfalle: die "1.1.0" ist hier fest verdrahtet, es gibt
      # keinen "latest"-Symlink im Plugin-Cache. Bei einem Plugin-Update auf
      # eine neue Version existiert dieser Pfad nicht mehr, Docker legt dann
      # stillschweigend einen leeren Ordner an (Container startet trotzdem) —
      # nach jedem Plugin-Update das Versionssegment hier von Hand nachziehen.
      # Der Preflight-Check "praesentation_skill" (app/preflight.py) schlägt
      # in diesem Fall mit "warn" an.
      - $HOME/.claude/plugins/cache/smartcon-skills/praesentation/1.1.0/skills/smartcon-praesentation:/root/.claude/skills/smartcon-praesentation:ro
      - $HOME/.kimi-code:/root/.kimi-code
      - $HOME/.config/higgsfield:/root/.config/higgsfield
      # SSH-Schlüssel + Cloudflare-Token für den Transkriptions-Tunnel (nur lesen)
      - $HOME/.ssh:/root/.ssh:ro
      - $HOME/.cloudflare:/root/.cloudflare:ro
    restart: unless-stopped
